services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gauntlet_ecology
      POSTGRES_USER: gauntlet
      POSTGRES_PASSWORD: gauntlet
    ports:
      - "5432:5432"
    volumes:
      - ./.postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gauntlet -d gauntlet_ecology"]
      interval: 2s
      timeout: 3s
      retries: 15
