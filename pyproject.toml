[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gauntlet-ecology"
version = "0.1.0"
description = "Evolutionary security challenge range"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "psycopg[binary,pool]>=3.2,<4.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1.0", "pytest>=8.0,<9.0"]

[tool.setuptools.packages.find]
include = ["api*", "scheduler*", "strategygen*"]

[tool.pytest.ini_options]
testpaths = ["api/tests", "schema/tests", "harness/tests", "scheduler/tests", "strategygen/tests"]
addopts = "-ra"
